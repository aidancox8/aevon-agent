name: Send Outreach Emails

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16-23 * * 1-5'  # Mon-Fri 9am-4pm PT

jobs:
  send:
    runs-on: ubuntu-latest
    # actions:write lets the backstop step dispatch cadre-send; contents:read is what checkout
    # needs. Declaring permissions narrows the default token rather than widening it.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Aevon signature vanished on 2026-08-18 and every email went out unsigned for a week
      # before a prospect's "NO" made it visible. This workflow had no shape guard at all, which
      # is why nothing caught it. See check-signature.js.
      - name: Guard the email shape and signature
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node check-email-shape.js
          node check-signature.js
          node check-schedules.js

      - name: Send due emails
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          DAILY_CAP: ${{ secrets.DAILY_CAP }}
          FOLLOWUP_MAX_SHARE: ${{ secrets.FOLLOWUP_MAX_SHARE }}
        run: node sender.js

      # BACKSTOP FOR THE CADRE SCHEDULER. On 2026-08-27 GitHub dropped every scheduled slot of
      # cadre-send.yml for the whole day while running this workflow on time, and 12 due sends
      # sat unsent until a manual flush. This workflow demonstrably fires, so it re-dispatches
      # cadre-send each run. Safe to fire redundantly: cadre-send has a concurrency group, counts
      # its daily cap from events, sends only what is due, and AUTO still requires CADRE_ARMED.
      - name: Nudge the Cadre sender
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cadre-send.yml -f live=AUTO --repo ${{ github.repository }}

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"$FROM_EMAIL\",\"to\":\"aidan@aevon.ca\",\"subject\":\"[Aevon ALERT] Sender failed\",\"text\":\"The Send Outreach Emails workflow failed on its scheduled run. Today's batch may not have gone out. Check the run: $RUN_URL\"}"
