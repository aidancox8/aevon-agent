name: Cadre - Posting Quote Autopilot

# The posting-quote email (cadre/posting-autopilot.js) on a schedule, so sends do not depend on
# Aidan's laptop being awake. Hourly on weekdays across 15:00-22:00 UTC, which covers 8am-3pm
# Pacific in both PDT and PST; the script's own send window (lib/send-window.js) drops any run
# that lands outside 8am-3pm PT, on a weekend, or on a Canadian/BC holiday.
#
# Each run sends at most 3, the day is capped at POSTING_DAILY_CAP (default 20).
# OFF SWITCH: set the repository variable POSTING_ARMED to anything but "true". Unarmed runs are
# dry runs that print the next picks and send nothing (verified: only --send sends).

on:
  schedule:
    - cron: '20 15-22 * * 1-5'
  workflow_dispatch:
    inputs:
      live:
        description: 'Type SEND to send now (still obeys the window and the daily cap)'
        required: false
        default: ''

concurrency:
  group: cadre-posting-autopilot
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          VERIFALIA_USER: ${{ secrets.VERIFALIA_USER }}
          VERIFALIA_PASS: ${{ secrets.VERIFALIA_PASS }}
          POSTING_DAILY_CAP: ${{ vars.POSTING_DAILY_CAP || '20' }}
        run: |
          if [ "${{ github.event.inputs.live }}" = "SEND" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.POSTING_ARMED }}" = "true" ]; }; then
            node cadre/posting-autopilot.js --send
          else
            echo "Not armed (repository variable POSTING_ARMED=true to go live). Dry run:"
            node cadre/posting-autopilot.js
          fi

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          node -e "
          const { Resend } = require('resend');
          new Resend(process.env.RESEND_API_KEY).emails.send({
            from: 'Aevon <' + process.env.FROM_EMAIL + '>',
            to: 'aidan@aevon.ca',
            subject: '[Aevon ALERT] Cadre posting autopilot failed',
            text: 'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          }).then(() => console.log('alert sent'));
          "
