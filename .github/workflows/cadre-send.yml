name: Cadre - Send Outreach

# The HR / credentials campaign. Third sender, same shape as Aevon and Tempo.
#
# NOT ARMED BY DEFAULT. A scheduled run only sends if the repository variable CADRE_ARMED is
# exactly "true". Until then a scheduled run performs a dry run and prints what it would have
# sent. The other two campaigns were armed by editing a workflow; this one is armed by flipping
# a variable, which is easier to reverse and leaves an audit trail.
#
# WHY IT RUNS EVERY HOUR AND NOT THREE TIMES A DAY.
#
# This used to fire at 9:40, 12:40 and 14:40 Pacific, which was fine while every send was booked
# at 9:40 Pacific too. It is not fine now. cadre/schedule.js books each email for 09:00-11:00 in
# the RECIPIENT'S timezone, and the sender only picks up what is already due, so a runner that
# wakes on Pacific time delivers everything east of Vancouver late:
#
#   a lead due 09:00 in St. John's is 11:30 UTC, and the old first slot was 16:40 UTC,
#   so it would have landed at 14:10 their time, four hours past the window it was chosen for.
#
# Hourly across 08:00-19:00 UTC covers 09:00 UK through 11:00 Pacific, which is every zone on the
# list. Extra runs are free: the sender sends only what is due, and the daily cap is counted from
# cadre_email_events rather than from how many times the workflow ran, so it cannot double-send.
# Hourly also removes the reason the three slots existed, which was that GitHub silently drops
# scheduled runs (it dropped Tempo's single 17:00 slot on 2026-08-06 and it sent nothing all day).
#
# Tue-Thu only, because that is the only thing the scheduler books. Mon and Fri runs would be
# no-ops, and a workflow that does nothing 40% of the time is a workflow nobody trusts.
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Type SEND to actually send (anything else = dry run)'
        required: false
        default: 'dry-run'
  schedule:
    # Every hour, 08:00-19:00 UTC, Tuesday to Thursday. Covers 09:00 in London through
    # 11:00 in Vancouver, which spans every zone any lead on the list sits in.
    - cron: '5 8-19 * * 2-4'

# Two runs sending at once would each read the same "sent today" count and both think there is
# room, which is the one way the daily cap can be beaten. Queue them instead.
concurrency:
  group: cadre-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard the email shape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node check-email-shape.js
          node check-signature.js
          node check-copy-lock.js

      # Runs BEFORE the sender, deliberately. Anyone who replied or asked to be left alone in the
      # last hour is moved out of 'queued' here, so this run cannot email them. Doing it after
      # the send would still record the opt-out but would honour it one email too late.
      - name: Read replies and honour opt-outs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        run: node cadre/reply-scan.js

      - name: Run Cadre sender
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          CADRE_DAILY_CAP: ${{ vars.CADRE_DAILY_CAP || '12' }}
          CADRE_MAILING_ADDRESS: ${{ vars.CADRE_MAILING_ADDRESS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          # gmail | resend. Gmail so the sends land in Aidan's own Sent folder and thread
          # naturally: 3,824 Resend sends left no trace he could search. The 5% breaker still
          # works, because the reply scan above attributes Gmail bounces and writes them to the
          # same events table the breaker reads. It is up to an hour behind a webhook, which at
          # 12/day is one or two extra sends.
          CADRE_VIA: ${{ vars.CADRE_VIA || 'gmail' }}
        run: |
          MANUAL_SEND="${{ github.event.inputs.live }}"
          ARMED="${{ vars.CADRE_ARMED }}"
          if [ "$MANUAL_SEND" = "SEND" ]; then
            echo "Manual send requested."
            node cadre/sender.js --send --via "$CADRE_VIA"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$ARMED" = "true" ]; then
            echo "CADRE_ARMED is true, sending via $CADRE_VIA."
            node cadre/sender.js --send --via "$CADRE_VIA"
          else
            echo "Not armed (set repository variable CADRE_ARMED=true to go live). Dry run:"
            node cadre/sender.js
          fi

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          node -e "
          const { Resend } = require('resend');
          new Resend(process.env.RESEND_API_KEY).emails.send({
            from: 'Aevon <' + process.env.FROM_EMAIL + '>',
            to: 'aidan@aevon.ca',
            subject: '[Aevon ALERT] Cadre sender failed',
            text: 'The Cadre sender workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          });"
