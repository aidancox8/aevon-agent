name: Personalize Leads

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max leads to personalize (blank = all)'
        required: false
        default: ''
  schedule:
    - cron: '0 13 * * 1-5'  # Mon-Fri 6am PT — before the sender runs, fills fresh copy

jobs:
  personalize:
    runs-on: ubuntu-latest
    # Scheduled runs are capped below (--limit); this is a backstop so a hung run
    # ends as a real failure (alert fires) instead of a silent 6h "cancelled".
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Personalize queued leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_AGENT: ${{ secrets.GEMINI_API_KEY_AGENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        # 150 here plus 280 in the refresh step sits under the 500/day Gemini free tier.
        # These two steps share one budget, and 450 + 300 left the refresh with nothing.
        run: node personalizer.js ${{ github.event_name == 'schedule' && '--limit 150' || (inputs.limit != '' && format('--limit {0}', inputs.limit) || '') }}

      # Rewrite copy left over from an older prompt. personalizer.js only writes for leads
      # that have none, so without this a prompt change reaches new leads only while a
      # months-long backlog keeps sending the old wording. 280 a night clears the 3,254 stale
      # Aevon emails in about twelve, which matters because a two-week read on new copy would
      # otherwise have measured the copy it replaced.
      #
      # No-op once nothing stale is left, and safe to re-run: it selects only leads whose copy
      # still has the defect, so each night resumes where the last stopped. Never fails the
      # workflow, because fresh personalization matters more than backfilling old copy.
      - name: Refresh stale copy
        if: github.event_name == 'schedule'
        continue-on-error: true
        # A step-level cap, because continue-on-error does not cover a cancellation. The first
        # scheduled run backed off against an exhausted quota for 5.5 hours until the job
        # timeout killed it, and a cancelled job reports neither success nor failure, so the
        # alert never fired and the whole night was lost silently.
        timeout-minutes: 75
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_AGENT: ${{ secrets.GEMINI_API_KEY_AGENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node regen-copy.js --limit ${{ vars.REGEN_DAILY_LIMIT || '280' }}

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"$FROM_EMAIL\",\"to\":\"aidan@aevon.ca\",\"subject\":\"[Aevon ALERT] Personalizer failed\",\"text\":\"The Personalize Leads workflow failed on its scheduled run. Fresh email copy may not have been generated, which can starve the sender. Check the run: $RUN_URL\"}"
